# Ephemeral infra for the e2e suites. Ports are offset from the defaults so a
# running local stack is never touched: postgres 5447, minio 9008/9009,
# kafka 19000.
#
# The default suite (test:e2e) uses postgres + minio only and stubs the kafka
# producer. Kafka is here for test:live, which runs the real bot binaries end to
# end. Starting it costs a few seconds either way, which is why the profile
# below keeps it out of the default `up`.
services:
  postgres:
    image: postgres:15-alpine
    ports:
      - '5447:5432'
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tw_stats
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 1s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    # tmpfs so a nearly-full host disk doesn't trip minio's free-space threshold
    volumes:
      - type: tmpfs
        target: /data
        tmpfs:
          size: 536870912
    ports:
      - '9008:9000'
      - '9009:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  # bot/missing dedupes hydration against redis, so the live check needs one
  redis:
    image: redis:7-alpine
    profiles: ['live']
    ports:
      - '16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.7.0
    profiles: ['live']
    ports:
      - '19000:19000'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19000
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19000
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1',
        ]
      interval: 2s
      timeout: 10s
      retries: 45
